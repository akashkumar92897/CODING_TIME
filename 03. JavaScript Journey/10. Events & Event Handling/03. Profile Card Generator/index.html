<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page-container">
      <div class="form-card">
        <header class="form-header">
          <span class="form-tag">IDENTITY MANAGEMENT</span>
          <h1>Identity Card Registration</h1>
          <p>Enter your details to create your identity profile.</p>
        </header>

        <form id="registration-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="occupation">Occupation</label>
            <input
              type="text"
              id="occupation"
              name="occupation"
              placeholder="e.g. Software Developer"
              required
            />
          </div>

          <div class="form-group">
            <label for="summary">One-line Summary</label>
            <textarea
              id="summary"
              name="summary"
              placeholder="Write a short introduction about yourself"
              rows="3"
              maxlength="120"
            ></textarea>
            <span class="field-hint">Maximum 120 characters</span>
          </div>

          <div class="form-group">
            <label for="profileinp">Profile Picture</label>
            <input
              type="file"
              name="profile-picture"
              id="profileinp"
              accept="image/*"
              hidden
            />

            <button type="button" id="upload-btn">
              <span>＋</span>
              Choose Profile Picture
            </button>

            <p id="file-name">PNG, JPG or WEBP</p>
          </div>

          <button type="submit" id="submit-btn">
            Create Profile
            <span>→</span>
          </button>
        </form>

        <footer class="form-footer">
          Your information will be used to create your identity profile.
        </footer>
      </div>
